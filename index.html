<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>موسوعة الوجبات | Meal Encyclopedia</title>
<link href="https://fonts.googleapis.com/css2?family=Readex+Pro:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#fff;--card:#E8F0EB;--tx:#123D32;--mu:#4c6a5e;--acc:#123D32;--ln:#cfdcd3;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
:root[data-theme=dark]{--bg:#101411;--card:#1a211c;--tx:#eef3ee;--mu:#9fb0a4;--acc:#2a7d5f;--ln:#2b362e}
*{box-sizing:border-box}html,body{margin:0}
body{background:var(--bg);color:var(--tx);font-family:'Readex Pro',system-ui,sans-serif;line-height:1.6}
.wrap{max-width:560px;margin:auto;padding:12px 16px 110px}
header{display:flex;justify-content:space-between;align-items:center;padding:6px 0 10px}
.logo{font-weight:700;font-size:18px}
button,select,input{font:inherit;color:inherit}
.ib{background:var(--card);border:1px solid var(--ln);border-radius:12px;min-width:44px;height:44px;margin-inline-start:6px;cursor:pointer}
h1{font-size:24px;line-height:1.35;margin:8px 0 14px}h2{font-size:18px;margin:20px 0 10px}
.in{width:100%;background:var(--card);border:1px solid var(--ln);border-radius:14px;padding:12px 14px;height:48px}
.row{display:flex;gap:8px;overflow-x:auto;padding:12px 0 4px;scrollbar-width:none}
.chip{flex:none;background:var(--card);border:1px solid var(--ln);border-radius:16px;padding:8px 12px;min-width:76px;text-align:center;font-size:13px;cursor:pointer}
.chip span{display:block;font-size:22px}.chip.on{background:var(--acc);color:#fff;border-color:var(--acc)}
.btn{background:var(--acc);color:#fff;border:0;border-radius:14px;min-height:48px;padding:0 18px;font-weight:600;cursor:pointer;width:100%}
.btn.s{background:var(--card);color:var(--tx);border:1px solid var(--ln)}
.hero{background:linear-gradient(135deg,var(--acc),#0b241d);color:#fff;border-radius:22px;padding:20px;display:flex;justify-content:space-between;align-items:center;cursor:pointer}
.hero .big{font-size:72px}.hero h3{margin:4px 0;font-size:22px}
.tag{background:rgba(255,255,255,.18);border-radius:10px;padding:2px 10px;font-size:12px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.card{background:var(--card);border:1px solid var(--ln);border-radius:18px;padding:12px;cursor:pointer}
.card .ph{font-size:48px;text-align:center;padding:6px 0}.card b{display:block;font-size:14px}
small,.mu{color:var(--mu);font-size:12px}
.meta{display:flex;gap:8px;margin:12px 0}.meta div{flex:1;background:var(--card);border-radius:14px;padding:10px;text-align:center;font-size:13px}
.li{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--ln)}
.li input[type=checkbox]{width:22px;height:22px;accent-color:var(--acc)}.li .g{flex:1}
.done{text-decoration:line-through;opacity:.5}
.pr{width:76px;background:var(--card);border:1px solid var(--ln);border-radius:10px;padding:6px;height:40px}
.bar{height:8px;background:var(--ln);border-radius:8px;overflow:hidden;margin:6px 0}.bar i{display:block;height:100%;background:var(--acc)}
.st{display:flex;align-items:center;gap:12px}.st button{width:44px;height:44px;border-radius:12px;border:1px solid var(--ln);background:var(--card);font-size:20px;cursor:pointer}
nav{position:fixed;inset-inline:0;bottom:0;background:var(--bg);border-top:1px solid var(--ln);display:flex;justify-content:space-around;padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px))}
nav button{background:none;border:0;display:flex;flex-direction:column;align-items:center;font-size:11px;color:var(--mu);min-width:56px;min-height:48px;cursor:pointer}
nav button span{font-size:22px}nav button.on{color:var(--tx);font-weight:700}
#toast{position:fixed;inset-inline:16px;bottom:96px;background:var(--acc);color:#fff;border-radius:14px;padding:12px;text-align:center;display:none}
select{width:100%;background:var(--card);border:1px solid var(--ln);border-radius:10px;padding:8px;height:42px;margin:4px 0}
textarea{width:100%;min-height:90px;background:var(--card);color:var(--tx);border:1px solid var(--ln);border-radius:12px;padding:10px}
.note{background:var(--card);border-radius:14px;padding:12px;font-size:13px;color:var(--mu);margin:12px 0}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #7fd1ae;outline-offset:2px}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<div id="toast" role="status"></div>
<script>
const CATS=[['s','🕌','سعودي وتراثي','Saudi'],['g','☕','خليجي وعربي','Gulf & Arab'],['i','🌍','عالمي','International'],['p','🥐','معجنات','Pastries'],['d','🍰','حلويات وكيك','Desserts'],['so','🥣','شوربات وسلطات','Soups & Salads'],['h','🥗','صحي وحمية','Healthy'],['l','🍛','غداء','Lunch'],['di','🍽️','عشاء','Dinner'],['r','🌙','رمضان','Ramadan'],['dr','🧃','مشروبات','Drinks'],['b','🍳','فطور','Breakfast']];
const CONT=[['آسيا','Asia'],['أفريقيا','Africa'],['أوروبا','Europe'],['أمريكا الشمالية','North America'],['أمريكا الجنوبية','South America'],['أوقيانوسيا','Oceania'],['القارة القطبية الجنوبية','Antarctica']];
const CT={sa:['السعودية','Saudi Arabia','🇸🇦',0],jo:['الأردن','Jordan','🇯🇴',0],it:['إيطاليا','Italy','🇮🇹',2],tn:['تونس','Tunisia','🇹🇳',1],mx:['المكسيك','Mexico','🇲🇽',3],br:['البرازيل','Brazil','🇧🇷',4],au:['أستراليا','Australia','🇦🇺',5]};
const U={g:['غ','g'],ml:['مل','ml'],pc:['حبة','pc'],tb:['م.ك','tbsp'],ts:['م.ص','tsp'],cl:['فص','clove']};
const ING={rice:['أرز','Rice'],chicken:['دجاج','Chicken'],beef:['لحم مفروم','Ground beef'],onion:['بصل','Onion'],tomato:['طماطم','Tomato'],garlic:['ثوم','Garlic'],oil:['زيت','Oil'],spice:['بهارات','Spices'],fava:['فول','Fava beans'],lemon:['ليمون','Lemon'],cumin:['كمون','Cumin'],fettuccine:['فيتوتشيني','Fettuccine'],mushroom:['فطر','Mushrooms'],cream:['كريمة طبخ','Cream'],parmesan:['بارميزان','Parmesan'],butter:['زبدة','Butter'],egg:['بيض','Eggs'],pepper:['فلفل رومي','Bell pepper'],lentil:['عدس','Lentils'],carrot:['جزر','Carrot'],tortilla:['خبز تورتيلا','Tortillas'],cheese:['جبن','Cheese'],cmilk:['حليب مكثف','Condensed milk'],cocoa:['كاكاو','Cocoa'],sugar:['سكر','Sugar'],fruit:['فواكه','Fruit'],coffee:['قهوة عربية','Arabic coffee'],cardamom:['هيل','Cardamom']};
const R=[
{id:'kabsa',c:['s','g','l'],y:'sa',e:'🍗',a:'كبسة الدجاج',n:'Chicken Kabsa',t:20,k:60,d:2,sv:4,p:45,i:[['rice',400,'g'],['chicken',1000,'g'],['onion',2,'pc'],['tomato',2,'pc'],['garlic',4,'cl'],['oil',3,'tb'],['spice',2,'tb']],sa:'قطّع البصل وحمّره في الزيت|أضف الدجاج والبهارات والطماطم والثوم وقلّب|أضف الأرز المنقوع مع ماء مناسب|اتركه على نار هادئة حتى ينضج الأرز',se:'Slice the onion and brown it in oil|Add chicken, spices, tomato and garlic, then stir|Add soaked rice with enough water|Simmer on low heat until the rice is cooked'},
{id:'foul',c:['s','b','r'],y:'sa',e:'🫘',a:'فول بالطماطم والليمون',n:'Fava Beans with Tomato & Lemon',t:10,k:10,d:1,sv:2,p:8,i:[['fava',400,'g'],['tomato',1,'pc'],['lemon',1,'pc'],['oil',2,'tb'],['garlic',2,'cl'],['cumin',1,'ts']],sa:'سخّن الفول على نار هادئة|اهرس الثوم مع الكمون وعصير الليمون وأضفها|زيّن بالطماطم المقطعة وزيت الزيتون',se:'Warm the beans on low heat|Mash garlic with cumin and lemon juice and stir in|Top with diced tomato and oil'},
{id:'pasta',c:['i','l','di'],y:'it',e:'🍝',a:'باستا الفطر الكريمية',n:'Creamy Mushroom Pasta',t:10,k:20,d:1,sv:4,p:28,i:[['fettuccine',200,'g'],['mushroom',200,'g'],['cream',240,'ml'],['parmesan',60,'g'],['garlic',3,'cl'],['butter',1,'tb']],sa:'اسلق الباستا حسب التعليمات|حمّر الثوم والفطر في الزبدة|أضف الكريمة والبارميزان حتى يتماسك الصوص|اخلط الباستا بالصوص وقدّمها ساخنة',se:'Boil the pasta as directed|Sauté garlic and mushrooms in butter|Add cream and parmesan until the sauce thickens|Toss pasta in the sauce and serve hot'},
{id:'shak',c:['b','i','di'],y:'tn',e:'🍳',a:'شكشوكة',n:'Shakshuka',t:10,k:20,d:1,sv:3,p:14,i:[['egg',4,'pc'],['tomato',4,'pc'],['onion',1,'pc'],['pepper',1,'pc'],['garlic',2,'cl'],['oil',2,'tb'],['cumin',1,'ts']],sa:'حمّر البصل والفلفل والثوم|أضف الطماطم والكمون واتركها تتكثف|اصنع حفرًا واكسر البيض فيها|غطِّ حتى ينضج البيض',se:'Sauté onion, pepper and garlic|Add tomato and cumin and let it thicken|Make wells and crack the eggs in|Cover until the eggs set'},
{id:'lentil',c:['so','r','h','g'],y:'jo',e:'🥣',a:'شوربة العدس',n:'Lentil Soup',t:10,k:35,d:1,sv:4,p:12,i:[['lentil',250,'g'],['onion',1,'pc'],['carrot',2,'pc'],['garlic',2,'cl'],['cumin',1,'ts'],['lemon',1,'pc'],['oil',2,'tb']],sa:'حمّر البصل والجزر والثوم في الزيت|أضف العدس والكمون وماء كافيًا|اتركها تنضج حتى يلين العدس ثم اهرسها|قدّمها مع عصير الليمون',se:'Sauté onion, carrot and garlic in oil|Add lentils, cumin and enough water|Cook until tender, then blend|Serve with lemon juice'},
{id:'tacos',c:['i','l','di'],y:'mx',e:'🌮',a:'تاكو اللحم',n:'Beef Tacos',t:15,k:15,d:1,sv:4,p:32,i:[['beef',400,'g'],['tortilla',8,'pc'],['tomato',2,'pc'],['onion',1,'pc'],['cheese',100,'g'],['spice',1,'tb']],sa:'اطبخ اللحم مع البصل والبهارات|سخّن التورتيلا|املأها باللحم والطماطم والجبن|قدّمها فورًا',se:'Cook the beef with onion and spices|Warm the tortillas|Fill with beef, tomato and cheese|Serve right away'},
{id:'brig',c:['d','i'],y:'br',e:'🍫',a:'بريغاديرو',n:'Brigadeiro',t:10,k:15,d:1,sv:20,p:18,i:[['cmilk',400,'g'],['cocoa',3,'tb'],['butter',1,'tb']],sa:'اخلط المكونات في قدر على نار هادئة|حرّك حتى يتماسك ويفترق عن الجوانب|برّده ثم شكّله كرات',se:'Combine the ingredients in a pot on low heat|Stir until thick and it pulls from the sides|Cool, then roll into balls'},
{id:'pav',c:['d','i'],y:'au',e:'🍰',a:'باڤلوڤا',n:'Pavlova',t:20,k:90,d:3,sv:8,p:26,i:[['egg',4,'pc'],['sugar',220,'g'],['cream',300,'ml'],['fruit',200,'g']],sa:'اخفق بياض البيض مع السكر حتى يتماسك|شكّله دائرة على صينية|اخبزه على حرارة منخفضة ثم اتركه يبرد|زيّنه بالكريمة والفواكه',se:'Whip egg whites with sugar until stiff|Shape into a round on a tray|Bake low, then let it cool in the oven|Top with cream and fruit'},
{id:'qahwa',c:['dr','s','g','r'],y:'sa',e:'☕',a:'قهوة عربية بالهيل',n:'Arabic Coffee with Cardamom',t:5,k:15,d:1,sv:4,p:6,i:[['coffee',3,'tb'],['cardamom',1,'ts']],sa:'اغلِ الماء في الدلة|أضف القهوة واتركها تغلي برفق|أضف الهيل وصفّها في الفنجان',se:'Boil water in the pot|Add coffee and let it simmer gently|Add cardamom and pour through a strainer'}];
let S={lang:'ar',theme:'dark',fav:[],list:[],plan:{},have:[],ai:{prov:'gemini',keys:{gemini:'',openai:'',claude:''},models:{gemini:'gemini-2.5-flash',openai:'gpt-4o-mini',claude:'claude-sonnet-5-5'}}};
try{Object.assign(S,JSON.parse(localStorage.getItem('me')||'{}'))}catch(e){}
const save=()=>{try{localStorage.setItem('me',JSON.stringify(S))}catch(e){}};
let V={n:'home',cat:'',cty:'',q:'',id:'',sv:0};
const $=i=>document.getElementById(i),ar=()=>S.lang==='ar',L=(a,e)=>ar()?a:e;
const nm=r=>L(r.a,r.n),iN=k=>L(ING[k][0],ING[k][1]),un=u=>L(U[u][0],U[u][1]),dn=r=>[L('سهل','Easy'),L('متوسط','Medium'),L('متقدم','Hard')][r.d-1];
const fmt=n=>{n=Math.round(n*10)/10;return n%1?n.toFixed(1):String(n)};
function toast(m){const t=$('toast');t.textContent=m;t.style.display='block';clearTimeout(toast.h);toast.h=setTimeout(()=>t.style.display='none',2200)}
function go(n,id){V.n=n;if(id){V.id=id;V.sv=R.find(r=>r.id===id).sv}render();scrollTo(0,0)}
function tg(k){if(k==='lang')S.lang=ar()?'en':'ar';else S.theme=S.theme==='dark'?'light':'dark';save();render()}
function card(r){return `<div class="card" role="button" tabindex="0" onclick="go('d','${r.id}')"><div class="ph">${r.e}</div><b>${nm(r)}</b><small>${CT[r.y][2]} ${L(CT[r.y][0],CT[r.y][1])} · ⏱ ${r.t+r.k} ${L('د','min')}</small></div>`}
function head(){return `<header><div class="logo">🍲 ${L('موسوعة الوجبات','Meal Encyclopedia')}</div><div><button class="ib" aria-label="language" onclick="tg('lang')">${L('EN','ع')}</button><button class="ib" aria-label="theme" onclick="tg('theme')">${S.theme==='dark'?'☀️':'🌙'}</button><button class="ib" aria-label="more" onclick="go('more')">⚙️</button></div></header>`}
function res(){const q=V.q.trim().toLowerCase();
 const rs=R.filter(r=>(!V.cat||(V.cat==='fav'?S.fav.includes(r.id):r.c.includes(V.cat)))&&(!V.cty||r.y===V.cty)&&(!q||[r.a,r.n,CT[r.y][0],CT[r.y][1],...r.i.map(x=>ING[x[0]].join(' '))].join(' ').toLowerCase().includes(q)));
 if(V.cat||V.cty||q)return rs.length?`<div class="grid" style="margin-top:12px">${rs.map(card).join('')}</div>`:`<div class="note">${V.cat==='fav'?L('لم تحفظ أي وصفة بعد. اضغط ❤ داخل أي وصفة.','No saved recipes yet. Tap ❤ inside any recipe.'):L('لا توجد وصفات في هذا القسم بعد. القسم جاهز لإضافة وصفات جديدة.','No recipes here yet. This section is ready for new recipes.')}</div>`;
 const f=R[0];return `<h2>${L('وصفة مقترحة','Featured')}</h2><div class="hero" role="button" tabindex="0" onclick="go('d','${f.id}')"><div><span class="tag">${L('وصفة نموذجية','Sample')}</span><h3>${nm(f)}</h3><small style="color:#d6e6dc">⏱ ${f.t+f.k} ${L('د','min')} · ${dn(f)}</small></div><div class="big">${f.e}</div></div><h2>${L('كل الوصفات','All recipes')}</h2><div class="grid">${R.slice(1).map(card).join('')}</div>`}
function srch(v){V.q=v;$('res').innerHTML=res()}
function setCat(c){V.cat=V.cat===c?'':c;render()}
function home(){const cp=V.cty?`<button class="chip on" style="min-width:0" onclick="V.cty='';render()">${CT[V.cty][2]} ${L(CT[V.cty][0],CT[V.cty][1])} ✕</button>`:'';
 return `<h1>${L('أهلًا بك! ماذا نطبخ اليوم؟','Hi! What shall we cook today?')}</h1><input class="in" type="search" aria-label="search" placeholder="${L('ابحث عن وصفة أو مكوّن أو دولة…','Search recipe, ingredient or country…')}" value="${V.q}" oninput="srch(this.value)">
 <div class="row"><button class="chip ${V.cat==='fav'?'on':''}" onclick="setCat('fav')"><span>❤️</span>${L('المفضلة','Saved')}</button>${CATS.map(c=>`<button class="chip ${V.cat===c[0]?'on':''}" onclick="setCat('${c[0]}')"><span>${c[1]}</span>${L(c[2],c[3])}</button>`).join('')}</div>${cp}<div id="res">${res()}</div>`}
function cuis(){return `<h1>${L('مطابخ العالم','World cuisines')}</h1><p class="mu">${L('تُبنى القائمة من بيانات الوصفات، وأي دولة جديدة تظهر هنا تلقائيًا عند إضافتها.','Built from recipe data: any new country appears here automatically once added.')}</p>`+CONT.map((c,i)=>{const cs=Object.keys(CT).filter(k=>CT[k][3]===i);
 return `<h2>${L(c[0],c[1])}</h2>`+(i===6?`<div class="note">${L('لا يوجد مطبخ تقليدي لأنتاركتيكا. تُعرض كمرجع جغرافي فقط لغذاء محطات الأبحاث العلمية، دون اختلاق وصفات.','Antarctica has no traditional cuisine. It is a geographic reference only, for research-station food, with no invented recipes.')}</div>`:cs.length?`<div class="grid">${cs.map(k=>`<button class="card" style="text-align:start" onclick="V.cty='${k}';V.cat='';V.q='';go('home')"><div class="ph">${CT[k][2]}</div><b>${L(CT[k][0],CT[k][1])}</b><small>${R.filter(r=>r.y===k).length} ${L('وصفة','recipes')}</small></button>`).join('')}</div>`:`<div class="note">${L('مدعومة للتوسع. لم تُضف مطابخ بعد.','Supported for expansion. No cuisines added yet.')}</div>`)}).join('')}
function tgl(k){const i=S.have.indexOf(k);i<0?S.have.push(k):S.have.splice(i,1);save();render()}
function cook(){const rs=R.map(r=>{const h=r.i.filter(x=>S.have.includes(x[0]));return{r,h,m:r.i.filter(x=>!S.have.includes(x[0])),p:Math.round(h.length/r.i.length*100)}}).filter(o=>o.p>0).sort((a,b)=>b.p-a.p);
 return `<h1>${L('اطبخ بما لديك','Cook with what you have')}</h1><p class="mu">${L('اختر المكونات المتوفرة في بيتك فقط. المكوّن غير المحدد يُعدّ ناقصًا.','Pick only what you actually have. Unselected items count as missing.')}</p><div class="row" style="flex-wrap:wrap;overflow:visible">${Object.keys(ING).map(k=>`<button class="chip ${S.have.includes(k)?'on':''}" style="min-width:0" onclick="tgl('${k}')">${iN(k)}</button>`).join('')}</div>
 ${S.have.length?`<button class="btn s" onclick="S.have=[];save();render()">${L('مسح الاختيار','Clear selection')}</button>`:''}<h2>${L('الوصفات المناسبة','Matching recipes')}</h2>`+(rs.length?rs.map(o=>`<div class="card" style="margin-bottom:10px" role="button" tabindex="0" onclick="go('d','${o.r.id}')"><b>${o.r.e} ${nm(o.r)} · ${o.p}%</b><div class="bar"><i style="width:${o.p}%"></i></div><small>✅ ${o.h.map(x=>iN(x[0])).join('، ')}</small><br><small>❌ ${o.m.length?o.m.map(x=>iN(x[0])).join('، '):L('لا شيء','none')}</small></div>`).join(''):`<div class="note">${L('اختر مكوّنًا واحدًا على الأقل لتظهر الاقتراحات.','Select at least one ingredient to see suggestions.')}</div>`)}
function addList(id,all){const rs=id?[R.find(r=>r.id===id)]:R.filter(r=>Object.values(S.plan).includes(r.id));
 rs.forEach(r=>{const f=(id?V.sv:r.sv)/r.sv;r.i.forEach(x=>{const e=S.list.find(l=>l.k===x[0]&&l.u===x[2]);if(e)e.q+=x[1]*f;else S.list.push({k:x[0],q:x[1]*f,u:x[2],done:0,p:0})})});save();toast(L('أُضيفت المكونات إلى قائمة التسوق','Added to your shopping list'))}
function det(){const r=R.find(x=>x.id===V.id),f=V.sv/r.sv,fv=S.fav.includes(r.id);const st=L(r.sa,r.se).split('|');
 return `<div style="display:flex;justify-content:space-between;margin:8px 0"><button class="ib" aria-label="back" onclick="go('home')">${ar()?'→':'←'}</button><button class="ib" aria-label="favorite" onclick="fav('${r.id}')">${fv?'❤️':'🤍'}</button></div><div class="hero" style="justify-content:center;cursor:default"><div class="big" style="font-size:110px">${r.e}</div></div><h1 style="margin-top:14px">${nm(r)}</h1><div class="mu">${CT[r.y][2]} ${L(CT[r.y][0],CT[r.y][1])} · <span class="tag" style="background:var(--card)">${L('وصفة نموذجية','Sample recipe')}</span></div>
 <div class="meta"><div>⏱ ${r.t}<br><small>${L('تحضير (د)','Prep (min)')}</small></div><div>🔥 ${r.k}<br><small>${L('طبخ (د)','Cook (min)')}</small></div><div>📊<br><small>${dn(r)}</small></div></div>
 <h2>${L('عدد الحصص','Servings')}</h2><div class="st"><button aria-label="-" onclick="V.sv=Math.max(1,V.sv-1);render()">−</button><b style="font-size:20px">${V.sv}</b><button aria-label="+" onclick="V.sv++;render()">+</button></div>
 <h2>${L('المكونات','Ingredients')}</h2>${r.i.map(x=>`<div class="li"><span class="g">${iN(x[0])}</span><b>${fmt(x[1]*f)} ${un(x[2])}</b></div>`).join('')}<p class="mu">${L('الكميات محسوبة تلقائيًا حسب الحصص. التكلفة التقديرية:','Quantities auto-scale with servings. Estimated cost:')} ~${fmt(r.p*f)} ${L('ر.س (تقدير وليس سعرًا فعليًا)','SAR (estimate, not a live price)')}</p>
 <h2>${L('طريقة التحضير','Steps')}</h2><ol style="padding-inline-start:20px">${st.map(s=>`<li style="margin-bottom:8px">${s}</li>`).join('')}</ol>
 <button class="btn" onclick="addList('${r.id}')">🛒 ${L('أضف المكونات لقائمة التسوق','Add ingredients to list')}</button><div style="height:8px"></div><button class="btn s" onclick="shareR('${r.id}')">${L('مشاركة عبر واتساب','Share on WhatsApp')}</button>`}
function fav(id){const i=S.fav.indexOf(id);i<0?S.fav.push(id):S.fav.splice(i,1);save();render()}
function wa(t){try{window.open('https://wa.me/?text='+encodeURIComponent(t),'_blank','noopener')}catch(e){toast(L('تعذّر فتح واتساب','Could not open WhatsApp'))}}
function shareR(id){const r=R.find(x=>x.id===id),f=V.sv/r.sv;wa(`${nm(r)}\n`+r.i.map(x=>`- ${iN(x[0])}: ${fmt(x[1]*f)} ${un(x[2])}`).join('\n')+'\n\n'+L(r.sa,r.se).split('|').map((s,i)=>`${i+1}. ${s}`).join('\n'))}
const DAYS=[['السبت','Sat'],['الأحد','Sun'],['الاثنين','Mon'],['الثلاثاء','Tue'],['الأربعاء','Wed'],['الخميس','Thu'],['الجمعة','Fri']],MEALS=[['فطور','Breakfast'],['غداء','Lunch'],['عشاء','Dinner']];
function plan(){return `<h1>${L('جدولي الأسبوعي','My weekly planner')}</h1>`+DAYS.map((d,i)=>`<div class="card" style="margin-bottom:10px;cursor:default"><b>${L(d[0],d[1])}</b>${MEALS.map((m,j)=>{const k=i+'_'+j;return `<select aria-label="${m[1]}" onchange="S.plan['${k}']=this.value;save()"><option value="">${L(m[0],m[1])}: —</option>${R.map(r=>`<option value="${r.id}" ${S.plan[k]===r.id?'selected':''}>${L(m[0],m[1])}: ${nm(r)}</option>`).join('')}</select>`}).join('')}</div>`).join('')+`<button class="btn" onclick="addList()">🛒 ${L('أضف مكونات الأسبوع للقائمة','Add week ingredients to list')}</button><div style="height:8px"></div><button class="btn s" onclick="print()">🖨 ${L('طباعة الجدول','Print schedule')}</button>`}
const tot=()=>S.list.reduce((a,l)=>a+(l.p||0),0);
function list(){return `<h1>${L('قائمة التسوق','Shopping list')}</h1><div style="display:flex;gap:8px"><input class="in" id="nl" placeholder="${L('أضف منتجًا…','Add an item…')}"><button class="btn" style="width:auto" onclick="addM()">+</button></div>`+(S.list.length?S.list.map((l,i)=>`<div class="li"><input type="checkbox" aria-label="done" ${l.done?'checked':''} onchange="S.list[${i}].done=this.checked?1:0;save();render()"><div class="g ${l.done?'done':''}">${l.k?iN(l.k):l.name}<br><small>${l.u?fmt(l.q)+' '+un(l.u):''}</small></div><input class="pr" type="number" min="0" step="0.5" inputmode="decimal" aria-label="price" placeholder="${L('ر.س','SAR')}" value="${l.p||''}" onchange="S.list[${i}].p=parseFloat(this.value)||0;save();$('tot').textContent=fmt(tot())"><button class="ib" aria-label="delete" onclick="S.list.splice(${i},1);save();render()">✕</button></div>`).join('')+`<h2>${L('الإجمالي حسب الأسعار المدخلة:','Total of entered prices:')} <span id="tot">${fmt(tot())}</span> ${L('ر.س','SAR')}</h2><button class="btn" onclick="wa('${L('قائمة التسوق','Shopping list')}\\n'+S.list.map(l=>'- '+(l.k?iN(l.k):l.name)+(l.u?' '+fmt(l.q)+' '+un(l.u):'')).join('\\n'))">${L('مشاركة عبر واتساب','Share on WhatsApp')}</button>`:`<div class="note">${L('القائمة فارغة. أضف مكونات من أي وصفة أو أضف منتجًا يدويًا.','Your list is empty. Add ingredients from a recipe or add an item manually.')}</div>`)}
function addM(){const v=$('nl').value.trim();if(!v)return;S.list.push({name:v,q:0,u:'',done:0,p:0});save();render()}
function more(){return `<h1>${L('الإعدادات','Settings')}</h1><button class="btn s" onclick="tg('lang')">🌐 ${L('Switch to English','التبديل إلى العربية')}</button><div style="height:8px"></div><button class="btn s" onclick="tg('theme')">${L('تبديل الوضع الليلي/النهاري','Toggle dark / light mode')}</button>
 ${aiUI()}<h2>${L('نسخة احتياطية','Backup')}</h2><textarea id="bk" aria-label="backup"></textarea><div style="display:flex;gap:8px;margin-top:8px"><button class="btn s" onclick="$('bk').value=JSON.stringify({fav:S.fav,list:S.list,plan:S.plan})">${L('تصدير','Export')}</button><button class="btn s" onclick="imp()">${L('استعادة','Restore')}</button></div>
 <div class="note">${L('بياناتك محفوظة على هذا الجهاز فقط. المزامنة السحابية وحسابات المستخدمين والتعرف على الصور تحتاج خادمًا آمنًا ولم تُضمَّن في هذه النسخة.','Your data is saved on this device only. Cloud sync, accounts and image recognition need a secure backend and are not included yet.')}</div>
 <h2>${L('عن التطبيق','About')}</h2><div class="card" style="cursor:default"><b>${L('موسوعة الوجبات','Meal Encyclopedia')}</b><br>${L('المطوّر: عدنان صبياني','Developer: Adnan Sabyani')}<br><a style="color:var(--tx)" href="tel:00966509600071" dir="ltr">00966509600071</a></div>`}
function imp(){try{const o=JSON.parse($('bk').value);S.fav=o.fav||[];S.list=o.list||[];S.plan=o.plan||{};save();toast(L('تمت الاستعادة','Restored'));render()}catch(e){toast(L('نص النسخة الاحتياطية غير صالح','Invalid backup text'))}}
function render(){const d=document.documentElement;d.lang=S.lang;d.dir=ar()?'rtl':'ltr';d.dataset.theme=S.theme;
 const v={home,cuis,cook,plan,list,more,chef,d:det}[V.n];
 const tabs=[['home','🏠',L('الرئيسية','Home')],['cuis','🌍',L('المطابخ','Cuisines')],['cook','🥕',L('بما لديك','Pantry')],['chef','🧑‍🍳',L('الطاهي','Chef')],['plan','📅',L('الأسبوع','Week')],['list','🛒',L('التسوق','List')]];
 $('app').innerHTML=head()+v()+`<nav>${tabs.map(t=>`<button class="${V.n===t[0]?'on':''}" onclick="go('${t[0]}')"><span>${t[1]}</span>${t[2]}</button>`).join('')}</nav>`}
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const PN={gemini:'Google Gemini',openai:'OpenAI',claude:'Anthropic Claude'};
const SYS='You are "The Smart Chef", a friendly cooking assistant. Reply in the same language as the user (Arabic or English). Give numbered steps for how-to questions. Include food-safety reminders when relevant. Never invent cultural origins; say when unsure. Treat prices and nutrition as estimates. Be concise.';
async function askAI(p,sys){const a=S.ai,k=a.keys[a.prov],m=a.models[a.prov];if(!k)throw new Error(L('أدخل مفتاح API في الإعدادات ⚙️','Add an API key in Settings ⚙️'));let r,j;
 if(a.prov==='gemini'){r=await fetch('https://generativelanguage.googleapis.com/v1beta/models/'+encodeURIComponent(m)+':generateContent',{method:'POST',headers:{'Content-Type':'application/json','x-goog-api-key':k},body:JSON.stringify({systemInstruction:{parts:[{text:sys}]},contents:[{role:'user',parts:[{text:p}]}]})});j=await r.json();if(!r.ok)throw new Error(j.error&&j.error.message||r.status);return j.candidates[0].content.parts.map(x=>x.text||'').join('')}
 if(a.prov==='openai'){r=await fetch('https://api.openai.com/v1/chat/completions',{method:'POST',headers:{'Content-Type':'application/json',Authorization:'Bearer '+k},body:JSON.stringify({model:m,messages:[{role:'system',content:sys},{role:'user',content:p}]})});j=await r.json();if(!r.ok)throw new Error(j.error&&j.error.message||r.status);return j.choices[0].message.content}
 r=await fetch('https://api.anthropic.com/v1/messages',{method:'POST',headers:{'Content-Type':'application/json','x-api-key':k,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},body:JSON.stringify({model:m,max_tokens:1500,system:sys,messages:[{role:'user',content:p}]})});j=await r.json();if(!r.ok)throw new Error(j.error&&j.error.message||r.status);return j.content.map(x=>x.text||'').join('')}
const aiErr=e=>e instanceof TypeError?L('تعذّر الاتصال. قد تمنع بيئة المعاينة الطلبات الخارجية، فافتح الملف من جهازك أو استضافتك.','Connection failed. The preview may block outside requests, so open the file from your device or hosting.'):e.message;
async function testAI(){toast(L('جارٍ الاختبار…','Testing…'));try{await askAI('Reply with OK','Reply with OK only');toast('✅ '+PN[S.ai.prov]+' OK')}catch(e){toast('⚠️ '+aiErr(e))}}
function aiUI(){const a=S.ai,p=a.prov;return `<h2>${L('مزوّد الذكاء الاصطناعي','AI provider')}</h2><div class="row" style="flex-wrap:wrap;overflow:visible">${Object.keys(PN).map(k=>`<button class="chip ${p===k?'on':''}" style="min-width:0" onclick="S.ai.prov='${k}';save();render()">${PN[k]}${a.keys[k]?' ✓':''}</button>`).join('')}</div><input class="in" type="password" autocomplete="off" dir="ltr" aria-label="API key" placeholder="API key: ${PN[p]}" value="${esc(a.keys[p])}" oninput="S.ai.keys[S.ai.prov]=this.value.trim();save()"><input class="in" dir="ltr" style="margin-top:8px" aria-label="model" value="${esc(a.models[p])}" oninput="S.ai.models[S.ai.prov]=this.value.trim();save()"><div style="height:8px"></div><button class="btn s" onclick="testAI()">${L('اختبار الاتصال','Test connection')}</button><div class="note">${L('المفتاح يُحفظ على هذا الجهاز فقط ولا يدخل في النسخة الاحتياطية. استخدام الذكاء الاصطناعي قد يكلّفك حسب مزوّدك. للنشر العام انقل المفاتيح إلى خادم وسيط.','The key is stored on this device only and is not in backups. AI usage may cost you money with your provider. For public release, move keys to a backend proxy.')}</div>`}
let CH=[],BUSY=0,GEN='';
function chef(){const g=V.sub==='gen';return `<h1>${L('الطاهي الذكي','The Smart Chef')}</h1><div class="row"><button class="chip ${!g?'on':''}" style="min-width:0" onclick="V.sub='';render()">${L('محادثة','Chat')}</button><button class="chip ${g?'on':''}" style="min-width:0" onclick="V.sub='gen';render()">${L('توليد وصفة','Generate recipe')}</button></div><small>${PN[S.ai.prov]}</small>`+(g?genUI():chatUI())}
function chatUI(){return (CH.length?CH.map(m=>`<div class="card" style="margin:8px 0;cursor:default;white-space:pre-wrap">${m.r==='u'?'🧑 ':'🧑‍🍳 '}${esc(m.t)}</div>`).join(''):`<div class="note">${L('اسأل عن طريقة طبخ أو بديل مكوّن أو وجبة اقتصادية.','Ask about a method, an ingredient substitute or a budget meal.')}</div>`)+(BUSY?`<div class="mu">…</div>`:'')+`<div style="display:flex;gap:8px;margin-top:10px"><input class="in" id="cq" placeholder="${L('اكتب سؤالك…','Type your question…')}" onkeydown="if(event.key==='Enter')sendChat()"><button class="btn" style="width:auto" onclick="sendChat()">${L('إرسال','Send')}</button></div>`}
async function sendChat(){const v=$('cq').value.trim();if(!v||BUSY)return;CH.push({r:'u',t:v});BUSY=1;render();try{CH.push({r:'a',t:await askAI(CH.slice(-8).map(m=>(m.r==='u'?'User: ':'Chef: ')+m.t).join('\n'),SYS)})}catch(e){CH.push({r:'a',t:'⚠️ '+aiErr(e)})}BUSY=0;render()}
function genUI(){return `<input class="in" id="g1" style="margin-top:8px" placeholder="${L('المكونات المتوفرة','Available ingredients')}"><input class="in" id="g2" style="margin-top:8px" placeholder="${L('المطبخ (اختياري)','Cuisine (optional)')}"><input class="in" id="g3" style="margin-top:8px" type="number" min="1" value="4" aria-label="servings"><input class="in" id="g4" style="margin-top:8px" placeholder="${L('نوع الوجبة، الحمية، الوقت، الميزانية…','Meal type, diet, time, budget…')}"><div style="height:8px"></div><button class="btn" onclick="genR()">${BUSY?'…':L('ولّد الوصفة','Generate recipe')}</button>`+(GEN?`<div class="note">⚠️ ${L('وصفة مولّدة بالذكاء الاصطناعي، وليست وصفة تقليدية موثّقة. الكميات والتكلفة والقيم الغذائية تقديرية.','AI-generated recipe, not a verified traditional dish. Quantities, cost and nutrition are estimates.')}</div><div class="card" style="cursor:default;white-space:pre-wrap">${esc(GEN)}</div>`:'')}
async function genR(){if(BUSY)return;const f=['g1','g2','g3','g4'].map(i=>$(i).value.trim());BUSY=1;GEN='';render();try{GEN=await askAI(`Create a complete recipe in ${ar()?'Arabic':'English'}. Ingredients: ${f[0]||'any'}. Cuisine: ${f[1]||'any'}. Servings: ${f[2]||4}. Notes: ${f[3]||'none'}. Include: name, short description, ingredients with exact quantities, numbered steps, prep and cook time, substitutes, estimated cost in SAR, estimated nutrition per serving. Label estimates clearly and do not claim it is an authentic traditional dish.`,SYS)}catch(e){GEN='⚠️ '+aiErr(e)}BUSY=0;render()}
render();
</script>
</body>
</html>
